<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prototipo - Gestión de productos</title>
    <link rel="stylesheet" href="../src/main/resources/static/css/estilos.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute">
    <symbol id="ic-editar" viewBox="0 0 24 24">
        <path fill="currentColor"
              d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
    </symbol>
    <symbol id="ic-borrar" viewBox="0 0 24 24">
        <path fill="currentColor" d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
    </symbol>
</svg>

<div class="panel">
    <div class="panel-header">
        <h2>Gestión de <b>productos</b></h2>
        <div class="panel-botones">
            <button type="submit" form="formLista" id="btnBorrarSel" class="btn-ic rojo" disabled
                    onclick="return confirm('¿Eliminar los registros seleccionados?')">
                <span>Borrar</span>
            </button>
            <a href="#" class="btn-ic verde"><span>Nuevo producto</span></a>
        </div>
    </div>

    <div class="panel-cuerpo">
        <form class="busqueda" onsubmit="return false">
            <input type="text" name="q" placeholder="Buscar por nombre...">
            <button type="submit" class="btn">Buscar</button>
            <a href="#" class="enlace">Limpiar</a>
        </form>

        <form id="formLista" onsubmit="alert('Prototipo: aquí se enviaría el formulario'); return false;">
            <table class="tabla">
                <thead>
                <tr>
                    <th class="col-check"><input type="checkbox" id="marcarTodos" title="Seleccionar todos"></th>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th class="col-acciones">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td class="col-check"><input type="checkbox" class="casilla"></td>
                    <td>1</td>
                    <td>Teclado mecánico</td>
                    <td>$ 899.00</td>
                    <td>15</td>
                    <td class="col-acciones">
                        <a href="#" class="icono editar" title="Editar">
                            <svg width="20" height="20">
                                <use href="#ic-editar"/>
                            </svg>
                        </a>
                        <button type="submit" class="icono eliminar" title="Eliminar"
                                onclick="return confirm('¿Eliminar este registro?')">
                            <svg width="20" height="20">
                                <use href="#ic-borrar"/>
                            </svg>
                        </button>
                    </td>
                </tr>
                <tr>
                    <td class="col-check"><input type="checkbox" class="casilla"></td>
                    <td>2</td>
                    <td>Mouse inalámbrico</td>
                    <td>$ 349.50</td>
                    <td>40</td>
                    <td class="col-acciones">
                        <a href="#" class="icono editar" title="Editar">
                            <svg width="20" height="20">
                                <use href="#ic-editar"/>
                            </svg>
                        </a>
                        <button type="submit" class="icono eliminar" title="Eliminar"
                                onclick="return confirm('¿Eliminar este registro?')">
                            <svg width="20" height="20">
                                <use href="#ic-borrar"/>
                            </svg>
                        </button>
                    </td>
                </tr>
                <tr>
                    <td class="col-check"><input type="checkbox" class="casilla"></td>
                    <td>3</td>
                    <td>Monitor 24 pulgadas</td>
                    <td>$ 2,899.99</td>
                    <td>8</td>
                    <td class="col-acciones">
                        <a href="#" class="icono editar" title="Editar">
                            <svg width="20" height="20">
                                <use href="#ic-editar"/>
                            </svg>
                        </a>
                        <button type="submit" class="icono eliminar" title="Eliminar"
                                onclick="return confirm('¿Eliminar este registro?')">
                            <svg width="20" height="20">
                                <use href="#ic-borrar"/>
                            </svg>
                        </button>
                    </td>
                </tr>
                <tr>
                    <td class="col-check"><input type="checkbox" class="casilla"></td>
                    <td>4</td>
                    <td>Cable HDMI 2m</td>
                    <td>$ 120.00</td>
                    <td>100</td>
                    <td class="col-acciones">
                        <a href="#" class="icono editar" title="Editar">
                            <svg width="20" height="20">
                                <use href="#ic-editar"/>
                            </svg>
                        </a>
                        <button type="submit" class="icono eliminar" title="Eliminar"
                                onclick="return confirm('¿Eliminar este registro?')">
                            <svg width="20" height="20">
                                <use href="#ic-borrar"/>
                            </svg>
                        </button>
                    </td>
                </tr>
                <tr>
                    <td class="col-check"><input type="checkbox" class="casilla"></td>
                    <td>5</td>
                    <td>Memoria USB 64GB</td>
                    <td>$ 180.00</td>
                    <td>60</td>
                    <td class="col-acciones">
                        <a href="#" class="icono editar" title="Editar">
                            <svg width="20" height="20">
                                <use href="#ic-editar"/>
                            </svg>
                        </a>
                        <button type="submit" class="icono eliminar" title="Eliminar"
                                onclick="return confirm('¿Eliminar este registro?')">
                            <svg width="20" height="20">
                                <use href="#ic-borrar"/>
                            </svg>
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </form>

        <div class="pie">
            <div class="conteo">Mostrando <b>5</b> de <b>7</b> registros</div>
            <div class="paginacion">
                <a href="#" class="activa">1</a>
                <a href="#">2</a>
                <a href="#">Siguiente</a>
            </div>
        </div>
    </div>
</div>

<script src="../src/main/resources/static/js/seleccion.js"></script>
</body>
</html>
