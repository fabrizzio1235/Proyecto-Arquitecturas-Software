<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Producto</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="contenedor">
    <h1 th:text="${titulo}">Producto</h1>

    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" class="formulario">
        <input type="hidden" th:field="*{id}">

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" th:field="*{nombre}">
        <span class="error-campo" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>

        <label for="precio">Precio</label>
        <input type="number" step="0.01" id="precio" th:field="*{precio}">
        <span class="error-campo" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></span>

        <label for="stock">Stock</label>
        <input type="number" id="stock" th:field="*{stock}">
        <span class="error-campo" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></span>

        <div class="barra">
            <button type="submit" class="btn primario">Guardar</button>
            <a th:href="@{/productos}" class="btn">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
