<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de productos</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="panel">

    <div class="panel-header">
        <h2>Gestión de <b>productos</b></h2>
        <div class="panel-botones">
            <button type="submit" form="formLista" id="btnBorrarSel" class="btn-ic rojo" disabled
                    onclick="return confirm('¿Eliminar los registros seleccionados?')">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
                    <circle cx="12" cy="12" r="10"/><line x1="7" y1="12" x2="17" y2="12"/>
                </svg>
                <span>Borrar</span>
            </button>
            <a th:href="@{/productos/nuevo}" class="btn-ic verde">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="7" x2="12" y2="17"/><line x1="7" y1="12" x2="17" y2="12"/>
                </svg>
                <span>Nuevo producto</span>
            </a>
        </div>
    </div>

    <div class="panel-cuerpo">
        <div th:if="${mensaje}" class="alerta ok" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alerta error" th:text="${error}"></div>

        <form th:action="@{/productos/eliminar-seleccionados}" method="post" id="formLista">
            <table class="tabla">
                <thead>
                <tr>
                    <th class="col-check"><input type="checkbox" id="marcarTodos" title="Seleccionar todos"></th>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th class="col-acciones">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${pagina.content}">
                    <td class="col-check"><input type="checkbox" name="ids" th:value="${p.id}" class="casilla"></td>
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${'$ ' + #numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td th:text="${p.stock}"></td>
                    <td class="col-acciones">
                        <a th:href="@{/productos/editar/{id}(id=${p.id})}" class="icono editar" title="Editar">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                            </svg>
                        </a>
                        <button type="submit" class="icono eliminar" title="Eliminar"
                                th:formaction="@{/productos/eliminar/{id}(id=${p.id})}"
                                onclick="return confirm('¿Eliminar este registro?')">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                <path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                            </svg>
                        </button>
                    </td>
                </tr>
                <tr th:if="${pagina.empty}">
                    <td colspan="6" class="vacio">No hay registros para mostrar.</td>
                </tr>
                </tbody>
            </table>
        </form>
    </div>
</div>

<script th:src="@{/js/seleccion.js}"></script>
</body>
</html>
