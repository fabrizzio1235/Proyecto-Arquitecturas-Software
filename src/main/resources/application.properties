spring.application.name=crud-productos

# Conexión MySQL (ajusta usuario y contraseña)
spring.datasource.url=jdbc:mysql://localhost:3306/crud_db?createDatabaseIfNotExist=true&serverTimezone=America/Merida
spring.datasource.username=root
spring.datasource.password=tu_password

# JPA / Hibernate: crea o actualiza la tabla automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Thymeleaf
spring.thymeleaf.cache=false